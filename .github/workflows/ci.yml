# CareAgent 周 6 CI 最小门禁：三端测试 + 镜像构建。
# 真实 MaaS 调用不进入 CI：Python 单测使用假 Chat/Embedding 客户端，
# Java 集成测试使用 Testcontainers 真实 PostgreSQL，前端只做类型检查与构建。
# Compose 端到端冒烟按固定砍项顺序第 10 条保留在本地验证（见 progress.md 周 4–6 记录）。

name: CI

on:
  push:
    branches: [main, week3, week4, week5, week6]
  pull_request:

jobs:
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-caching: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Run Python tests
        run: uv run pytest -q

  java-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run unit and Testcontainers integration tests
        working-directory: java-service
        run: ./mvnw --batch-mode --no-transfer-progress test

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install, typecheck and build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

  image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Java, Python and Web images
        run: docker compose build java-service python-service web
