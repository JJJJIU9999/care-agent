# CareAgent 周 3：PostgreSQL/pgvector + Java 主业务服务。
# FastAPI 仍按周 2 的本机命令启动；Nginx 与 Vue 在后续周次加入。
#
# POSTGRES_PASSWORD 是仅用于本机演示的容器口令，可用环境变量覆盖，禁止在生产复用。
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: careagent-postgres
    environment:
      POSTGRES_USER: careagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careagent_local_dev}
      POSTGRES_DB: careagent
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careagent -d careagent"]
      interval: 5s
      timeout: 3s
      retries: 12

  java-service:
    build:
      context: ./java-service
    container_name: careagent-java
    environment:
      APP_DATABASE_URL: jdbc:postgresql://postgres:5432/careagent
      APP_DATABASE_USER: careagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careagent_local_dev}
      JWT_SECRET: ${JWT_SECRET:-careagent-local-jwt-secret-change-me-2026}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-careagent-local-internal-token}
      PYTHON_BASE_URL: ${PYTHON_BASE_URL:-http://host.docker.internal:8010}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
