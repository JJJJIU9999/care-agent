# CareAgent 周 2：只启动 PostgreSQL + pgvector。
# 其余服务（Spring Boot / FastAPI / Nginx / Vue）按路线图在周 3–6 逐步加入。
#
# POSTGRES_PASSWORD 是仅用于本机演示的容器口令，可用环境变量覆盖，禁止在生产复用。
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: careagent-postgres
    environment:
      POSTGRES_USER: careagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careagent_local_dev}
      POSTGRES_DB: careagent
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careagent -d careagent"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
