# CareAgent 前端：静态 SPA + 后端代理。
# 浏览器只访问 Nginx（8088）；内部接口不对外暴露。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SSE 长连接路径：关闭缓冲、延长超时
    location ~ ^/api/v1/conversations/[^/]+/messages$ {
        proxy_pass http://java-service:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        proxy_pass http://java-service:8080;
        proxy_http_version 1.1;
        proxy_set_header X-Request-ID $http_x_request_id;
    }

    location = /health {
        proxy_pass http://java-service:8080/health;
    }

    # 前端路由回退：非资源路径一律交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
