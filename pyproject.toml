[project]
name = "care-agent-ai"
version = "0.1.0"
description = "CareAgent week 0 Python feasibility checks"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.116",
    "httpx>=0.28",
    "openai>=1.100",
    "psycopg[binary]>=3.3.5",
    "pypdf>=6.17.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.0.1",
    "torch>=2.14.0",
    "uvicorn>=0.35",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pytest>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/care_agent_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
